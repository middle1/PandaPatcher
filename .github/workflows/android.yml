name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup keystore
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          if [ ! -z "${{ secrets.SIGNING_KEY }}" ]; then
            echo "releaseStorePassword=${{ secrets.KEY_STORE_PASSWORD }}" >> gradle.properties
            echo "releaseKeyAlias=${{ secrets.ALIAS }}" >> gradle.properties
            echo "releaseKeyPassword=${{ secrets.KEY_PASSWORD }}" >> gradle.properties
            echo "releaseStoreFile=key.jks" >> gradle.properties
            echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > key.jks
          fi

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload release APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: panda-patcher-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: panda-patcher-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: app/build/outputs/logs/
          retention-days: 7
